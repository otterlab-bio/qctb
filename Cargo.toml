[package]
name = "qctb"
version = "0.1.0"
edition = "2021"
description = "QC tools for bioinformatics - fastqcx and methx summary reporting"
authors = ["otter team"]
license = "MIT"
repository = "https://github.com/otterlab-bio/qctb"
readme = "README.md"

[dependencies]
# CLI framework
clap = { version = "4.5", features = ["derive"] }

# YAML parsing
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

# Excel output
rust_xlsxwriter = "0.57"

# Error handling
anyhow = "1.0"

# Regex for text parsing
regex = "1.10"

# Excel input parsing
calamine = "0.24"

# Temporary files for atomic output replacement
tempfile = "3.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
